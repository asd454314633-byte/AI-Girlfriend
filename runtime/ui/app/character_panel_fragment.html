<!--
  人物与「记住的事」面板的挂载位（任务 §10 / §16）。

  把这四行贴到 index.html 里想让面板出现的位置即可；character_panel.js 看到页面上
  已经有 #char-panel 就直接装进去，看不到就自己插一个卡片，所以这块是可选的。
  面板需要的样式与脚本引用见 character_panel.css / character_panel.js。
-->
<div id="char-panel-mount" class="char-panel-slot">
  <!-- character_panel.js 会把面板装进下面这个容器 -->
  <section id="char-panel" data-slot="manual"></section>
</div>
